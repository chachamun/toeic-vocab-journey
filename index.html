<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>多益字彙旅程</title>
<meta name="description" content="個人多益 800+ 碎片學習：單字卡、聽力、閱讀、跟讀錄音、記憶曲線測驗、每日打卡">
<meta name="theme-color" content="#0f9d80" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#0e1512" media="(prefers-color-scheme:dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="字彙旅程">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap');
  :root{
    --bg:#f1f6f4; --surface:#fff; --surface-2:#e9f2ee;
    --ink:#16211d; --ink-2:#586a63; --ink-3:#8a9b93;
    --line:#e0eae6; --line-2:#d0ded8;
    --accent:#0f9d80; --accent-deep:#0a7862; --accent-soft:#d7efe8; --on-accent:#fff;
    --amber:#e0952c; --good:#2f9e6b; --good-bg:#e2f4ea; --bad:#d4574d; --bad-bg:#fbe7e5;
    --blue:#3f77d6; --purple:#7b4fce; --rec:#e0453c;
    --shadow:0 1px 2px rgba(16,40,33,.05),0 8px 24px -12px rgba(16,40,33,.18);
    --shadow-lift:0 4px 12px rgba(16,40,33,.08),0 20px 48px -20px rgba(16,40,33,.28);
    --r:16px; --r-lg:22px;
    --disp:'Bricolage Grotesque',system-ui,sans-serif;
    --en:system-ui,-apple-system,'Segoe UI',sans-serif;
    --zh:'Noto Sans TC',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
    --bg:#0e1512; --surface:#151f1b; --surface-2:#1b2723;
    --ink:#e9f2ee; --ink-2:#9fb2aa; --ink-3:#6f847b;
    --line:#243430; --line-2:#2e4039;
    --accent:#33c6a3; --accent-deep:#2aa588; --accent-soft:#173229; --on-accent:#04140f;
    --amber:#e2a344; --good:#43b57f; --good-bg:#14301f; --bad:#e0685e; --bad-bg:#331a18;
    --blue:#6f9ff0; --purple:#b393ee; --rec:#f0655c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
    --shadow-lift:0 6px 16px rgba(0,0,0,.35),0 24px 56px -22px rgba(0,0,0,.7);
  }}
  :root[data-theme="dark"]{
    --bg:#0e1512; --surface:#151f1b; --surface-2:#1b2723;
    --ink:#e9f2ee; --ink-2:#9fb2aa; --ink-3:#6f847b;
    --line:#243430; --line-2:#2e4039;
    --accent:#33c6a3; --accent-deep:#2aa588; --accent-soft:#173229; --on-accent:#04140f;
    --amber:#e2a344; --good:#43b57f; --good-bg:#14301f; --bad:#e0685e; --bad-bg:#331a18;
    --blue:#6f9ff0; --purple:#b393ee; --rec:#f0655c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
    --shadow-lift:0 6px 16px rgba(0,0,0,.35),0 24px 56px -22px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--zh);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
  #app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
  button{font-family:inherit;color:inherit;cursor:pointer}
  .en{font-family:var(--en)} .ph{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
  .muted{color:var(--ink-2)} .tiny{font-size:12px} .nowrap{white-space:nowrap}

  header{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line)}
  .head-in{padding:10px 16px;display:flex;align-items:center;gap:10px}
  .brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
  .brand-mark{width:30px;height:30px;border-radius:9px;flex:none;background:linear-gradient(145deg,var(--accent),var(--accent-deep));
    display:grid;place-items:center;color:var(--on-accent);font-family:var(--disp);font-weight:800;font-size:17px}
  .brand b{font-family:var(--disp);font-weight:800;font-size:16px;white-space:nowrap}
  .icon-btn{width:34px;height:34px;flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}

  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .view{display:flex;flex-direction:column;gap:14px}
  h2.sect{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:4px 2px 0}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:15px}
  .row{display:flex;align-items:center;gap:10px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 18px;
    font-family:var(--zh);font-weight:700;font-size:15px;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow);width:100%;text-decoration:none}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-2);box-shadow:none}
  .btn.sm{padding:10px 14px;font-size:13.5px;width:auto;border-radius:11px}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.5;pointer-events:none}
  .two{display:flex;gap:10px} .two>*{flex:1}
  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700}
  .pill.new{background:var(--surface-2);color:var(--ink-2)}
  .pill.learning{background:#fff4e2;color:#a56a12}
  :root[data-theme="dark"] .pill.learning,:root:not([data-theme="light"]) .pill.learning{background:#2f2612;color:var(--amber)}
  .pill.known{background:var(--good-bg);color:var(--good)}
  .stars{color:var(--amber);font-size:12px}

  .uswitch{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .uchip{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);
    border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
  .uchip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
  .uchip .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
  .uchip.on .dot{background:var(--on-accent)}

  .bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s}
  .ring{width:96px;height:96px;position:relative;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .pct b{font-family:var(--disp);font-weight:800;font-size:24px;line-height:1}
  .ring .pct span{font-size:10px;color:var(--ink-2)}
  .kv{display:flex;align-items:center;gap:8px;font-size:13px}
  .kv b{font-family:var(--disp);margin-left:auto;font-variant-numeric:tabular-nums}
  .dot3{width:9px;height:9px;border-radius:3px;flex:none}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
  .stat .k{font-size:11px;color:var(--ink-2)}
  .stat .v{font-family:var(--disp);font-weight:800;font-size:22px;margin-top:4px;line-height:1;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:11px;color:var(--ink-3)}

  /* ── 跟讀列（每頁都有）────────────────────────── */
  .sbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px}
  .sbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);
    border-radius:10px;padding:7px 12px;font-size:12.5px;font-weight:700;color:var(--ink)}
  .sbtn.play{background:var(--accent);color:var(--on-accent);border-color:transparent}
  .sbtn.mic{color:var(--rec);border-color:color-mix(in srgb,var(--rec) 35%,var(--line))}
  .sbtn.mic.rec{background:var(--rec);color:#fff;border-color:transparent;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.62}}
  .sbtn:active{transform:scale(.96)}
  .sbtn[disabled]{opacity:.45;pointer-events:none}
  .spd{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px;margin-left:auto}
  .spd button{border:0;background:none;border-radius:8px;padding:5px 8px;font-size:11.5px;font-weight:700;color:var(--ink-3)}
  .spd button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

  /* ── 跟讀結果面板 ──────────────────────────── */
  .shadow-panel{margin-top:9px;border:1px solid var(--line-2);border-radius:13px;background:var(--surface-2);padding:11px;font-size:13px}
  .shadow-panel .sp-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .shadow-panel .sp-head b{font-size:12.5px}
  .shadow-panel .sp-head .x{margin-left:auto;border:0;background:none;color:var(--ink-3);font-size:16px;line-height:1;padding:2px 4px}
  .sp-score{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1}
  .sp-diff{line-height:2;margin-top:6px;word-break:break-word}
  .sp-diff .ok{color:var(--ink-2)}
  .sp-diff .miss{background:var(--bad-bg);color:var(--bad);border-radius:5px;padding:1px 5px;font-weight:700;text-decoration:line-through;text-decoration-thickness:1px}
  .sp-diff .add{background:#fff4e2;color:#a56a12;border-radius:5px;padding:1px 5px;font-weight:700}
  :root[data-theme="dark"] .sp-diff .add,:root:not([data-theme="light"]) .sp-diff .add{background:#2f2612;color:var(--amber)}
  .sp-note{font-size:11.5px;color:var(--ink-3);margin-top:7px;line-height:1.55}
  .sp-audio{width:100%;margin-top:8px;height:34px}
  .lvlmeter{height:5px;border-radius:99px;background:var(--line-2);overflow:hidden;margin-top:8px}
  .lvlmeter i{display:block;height:100%;background:var(--rec);width:0%;transition:width .08s linear}

  /* flashcard */
  .fc-top{display:flex;align-items:center;gap:10px}
  .fc-count{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;
    border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:7px 9px;flex:none;white-space:nowrap}
  .fc-count .caret{font-size:10px;color:var(--ink-3)}
  .navbtn{width:36px;height:36px;flex:none;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);
    color:var(--ink);font-size:20px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0 0 3px}
  .navbtn[disabled]{opacity:.3;pointer-events:none}
  .navbtn:active{transform:scale(.94)}
  .vjump{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
  .vj{aspect-ratio:1;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-family:var(--disp);
    font-weight:700;font-size:12px;color:var(--ink-3);padding:0}
  .vj.known{background:var(--good-bg);color:var(--good);border-color:transparent}
  .vj.learning{background:#fff4e2;color:#a56a12;border-color:transparent}
  :root[data-theme="dark"] .vj.learning,:root:not([data-theme="light"]) .vj.learning{background:#2f2612;color:var(--amber)}
  .vj.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
  .flip{perspective:1600px;height:clamp(360px,56vh,520px);flex:none}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
  .flip.flipped .flip-inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lift);overflow:hidden}
  .face.back{transform:rotateY(180deg)}
  .face-scroll{overflow-y:auto;padding:20px;height:100%}
  .fc-front{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;height:100%}
  .fc-front .num{position:absolute;top:14px;left:16px;font-family:var(--disp);font-weight:800;color:var(--ink-3);font-size:13px}
  .fc-front .st{position:absolute;top:13px;right:16px}
  .headword{font-family:var(--disp);font-weight:800;font-size:min(10vw,40px);line-height:1.1;word-break:break-word}
  .headword.long{font-size:min(7.5vw,30px)}
  .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:var(--ink-3);font-size:11.5px}
  .back-word{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .back-word .w{font-family:var(--disp);font-weight:800;font-size:22px}
  .pos-line{margin-top:10px;display:flex;flex-direction:column;gap:5px}
  .pos-line .p{display:flex;gap:8px;align-items:baseline}
  .pos-tag{font-family:var(--mono);font-size:11px;color:var(--on-accent);background:var(--accent);border-radius:6px;padding:1px 6px;flex:none}
  .exbox{margin-top:12px;border-top:1px dashed var(--line-2);padding-top:11px;display:flex;flex-direction:column;gap:12px}
  .exbox .en{font-size:14.5px} .exbox .en b{color:var(--accent-deep);font-weight:800}
  :root[data-theme="dark"] .exbox .en b,:root:not([data-theme="light"]) .exbox .en b{color:var(--accent)}
  .exbox .zh{color:var(--ink-2);font-size:12.5px;margin-top:2px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;color:var(--ink-2)}
  .chip .en{color:var(--ink);font-weight:700}
  .chip.der{border-style:dashed}
  .note-box{margin-top:12px;background:var(--accent-soft);border-radius:10px;padding:9px 11px;cursor:auto}
  .note-box.empty{background:none;padding:0}
  .note-box .nk{font-size:11.5px;font-weight:700;color:var(--accent-deep);flex:1}
  .note-box .ntext{font-size:13.5px;white-space:pre-wrap;word-break:break-word;margin-top:4px;color:var(--ink)}
  .note-box textarea{width:100%;box-sizing:border-box;margin-top:6px;font:inherit;font-size:16px;line-height:1.5;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}
  .note-add{width:100%;border:1px dashed var(--line-2);background:none;color:var(--ink-2);font:inherit;font-size:13px;padding:8px;border-radius:10px;cursor:pointer}
  .note-edit{border:0;background:none;color:var(--accent-deep);font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:2px 4px}
  .note-line{font-size:12.5px;color:var(--ink);background:var(--accent-soft);border-radius:8px;padding:5px 8px;margin-top:6px;white-space:pre-wrap;word-break:break-word}
  .note-dot{font-size:12px}
  :root[data-theme="dark"] .note-box .nk,:root[data-theme="dark"] .note-edit{color:var(--accent)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .note-box .nk,:root:not([data-theme="light"]) .note-edit{color:var(--accent)}}
  .chip .sup{font-size:10px;color:var(--ink-3);margin-left:3px}
  .forms{margin-top:12px;border-top:1px dashed var(--line-2);padding-top:10px}
  .forms .fk,.famk{font-size:11.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
  .famk{margin:12px 0 -4px}
  .frow{display:flex;gap:8px;align-items:flex-start;margin-top:5px}
  .fcells{display:flex;flex-wrap:wrap;gap:4px 12px}
  .fcell{font-size:13px;white-space:nowrap} .fcell i{font-style:normal;font-size:10.5px;color:var(--ink-3);margin-right:4px}
  .fcell b{font-weight:700} .fnote{font-size:12.5px;color:var(--ink-2)}
  .aitag{display:inline-block;font-size:10px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:5px;padding:0 4px;margin-left:6px;vertical-align:1px}
  .tip{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));border-radius:12px;padding:10px 11px;margin-top:8px}
  .tip .k{font-family:var(--disp);font-weight:700;font-size:10.5px;letter-spacing:.08em;color:var(--accent-deep);text-transform:uppercase}
  :root[data-theme="dark"] .tip .k,:root:not([data-theme="light"]) .tip .k{color:var(--accent)}
  .tip .t{font-size:12.5px;margin-top:3px;line-height:1.6}
  .grade{display:flex;gap:10px}
  .grade button{flex:1;border-radius:13px;padding:13px;font-weight:700;font-size:14px;border:1px solid var(--line-2);background:var(--surface)}
  .grade .again{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
  .grade .known{color:var(--on-accent);background:var(--accent);border-color:transparent}

  .sent{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow)}
  .sent .idx{font-family:var(--disp);font-weight:700;font-size:11px;color:var(--ink-3)}
  .sent .en{font-size:15.5px;line-height:1.55;margin-top:3px}
  .sent .en b{color:var(--accent-deep);font-weight:800}
  :root[data-theme="dark"] .sent .en b,:root:not([data-theme="light"]) .sent .en b{color:var(--accent)}
  .sent .zh{color:var(--ink-2);font-size:13px;margin-top:6px}
  .hidden-text{filter:blur(6px);user-select:none;opacity:.55}
  .reveal-btn{border:0;background:none;color:var(--accent-deep);font-size:12px;font-weight:700;padding:4px 0}
  :root[data-theme="dark"] .reveal-btn,:root:not([data-theme="light"]) .reveal-btn{color:var(--accent)}

  /* 影片內嵌 */
  .ytwrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;box-shadow:var(--shadow)}
  .ytwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .ytfall{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--surface-2);padding:16px;text-align:center}
  .player{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
  .play-big{width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow-lift)}
  .seekwrap{width:100%;display:flex;align-items:center;gap:9px;margin-top:2px}
  .seekwrap .t{font-family:var(--mono);font-size:11px;color:var(--ink-2);flex:none;font-variant-numeric:tabular-nums}
  input[type=range].seek{-webkit-appearance:none;appearance:none;flex:1;height:22px;background:transparent;cursor:pointer}
  input[type=range].seek::-webkit-slider-runnable-track{height:6px;border-radius:99px;
    background:linear-gradient(to right,var(--accent) 0%,var(--accent) var(--p,0%),var(--surface-2) var(--p,0%),var(--surface-2) 100%)}
  input[type=range].seek::-moz-range-track{height:6px;border-radius:99px;background:var(--surface-2)}
  input[type=range].seek::-moz-range-progress{height:6px;border-radius:99px;background:var(--accent)}
  input[type=range].seek::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--accent);border:2px solid var(--surface);box-shadow:var(--shadow);margin-top:-5px}
  input[type=range].seek::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:var(--shadow)}
  .lctrl{display:flex;align-items:center;gap:12px;width:100%;justify-content:center}
  .lskip{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;font-size:11px;font-weight:700}
  .lskip:active{transform:scale(.94)}

  .opts{display:flex;flex-direction:column;gap:9px;margin-top:8px}
  .opt{text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:13px;padding:12px 13px;font-size:15px;display:flex;align-items:center;gap:10px}
  .opt .k{width:23px;height:23px;border-radius:7px;border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:12px;color:var(--ink-2);flex:none}
  .opt.correct{background:var(--good-bg);border-color:var(--good)} .opt.correct .k{background:var(--good);color:#fff;border-color:transparent}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad)} .opt.wrong .k{background:var(--bad);color:#fff;border-color:transparent}
  .opt[disabled]{pointer-events:none}
  .q-word{font-family:var(--disp);font-weight:800;font-size:28px;text-align:center;padding:4px 0}
  .q-cloze{font-size:16px;line-height:1.9}
  .q-cloze u{text-decoration:none;border-bottom:2px solid var(--accent);padding:0 20px;color:transparent}
  .score-big{font-family:var(--disp);font-weight:800;font-size:44px;line-height:1}
  .mode-card{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow);width:100%;text-align:left}
  .mode-card .mi{width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:21px}
  .mode-card .t{flex:1;min-width:0}
  .mode-card .t b{display:block;font-size:15px} .mode-card .t span{font-size:12px;color:var(--ink-2)}
  .mode-card .n{font-family:var(--disp);font-weight:800;font-size:19px;color:var(--accent-deep);font-variant-numeric:tabular-nums}
  :root[data-theme="dark"] .mode-card .n,:root:not([data-theme="light"]) .mode-card .n{color:var(--accent)}

  .unit-card{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;box-shadow:var(--shadow);text-align:left;width:100%;margin-top:7px}
  .unit-card.cur{border-color:var(--accent);background:var(--accent-soft)}
  .mini-bar{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:5px}
  .mini-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

  .cal{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
  .cal .d{aspect-ratio:1;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-size:9px;color:var(--ink-3)}
  .cal .d.on{background:var(--accent);color:var(--on-accent);font-weight:700}
  .cal .d.today{outline:2px solid var(--accent);outline-offset:1px}
  .barsC{display:flex;align-items:flex-end;gap:7px;height:76px}
  .barsC .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
  .barsC .b i{display:block;width:100%;background:var(--accent);border-radius:5px 5px 0 0;min-height:3px}
  .barsC .b span{font-size:9.5px;color:var(--ink-3)}
  .streak{font-family:var(--disp);font-weight:800;font-size:40px;line-height:1;color:var(--accent-deep)}
  :root[data-theme="dark"] .streak,:root:not([data-theme="light"]) .streak{color:var(--accent)}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:7px 6px calc(7px + env(safe-area-inset-bottom,0px));
    background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .nav-inner{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:1px}
  .nav-inner button{border:0;background:none;padding:5px 1px;border-radius:11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);font-size:9.5px;font-weight:700}
  .nav-inner button.on{color:var(--accent-deep)}
  :root[data-theme="dark"] .nav-inner button.on,:root:not([data-theme="light"]) .nav-inner button.on{color:var(--accent)}
  .nav-inner svg{width:21px;height:21px}

  .scrim{position:fixed;inset:0;z-index:40;background:rgba(10,20,17,.5);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s;cursor:pointer}
  .scrim .sheet{cursor:auto}
  .sheet-head{position:sticky;top:-8px;z-index:2;background:var(--surface);margin:-8px -18px 0;padding:0 18px 10px;border-bottom:1px solid var(--line);touch-action:none}
  .sheet-done{border:0;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;font-size:15px;padding:8px 18px;border-radius:99px;cursor:pointer}
  .scrim[hidden]{display:none!important}
  .scrim.show{opacity:1}
  .sheet{width:100%;max-width:640px;max-height:86vh;max-height:86dvh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;
    padding:8px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .28s cubic-bezier(.3,.8,.3,1)}
  .scrim.show .sheet{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:99px;background:var(--line-2);margin:8px auto 14px}
  .set-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .set-row:last-child{border-bottom:0}
  .set-row .lab{flex:1;min-width:120px} .set-row .lab b{display:block} .set-row .lab span{font-size:12px;color:var(--ink-2)}
  select.native,input.native{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 10px;
    font-family:var(--zh);font-size:13px;color:var(--ink);max-width:56vw}
  input.native{width:100%;max-width:100%;margin-top:6px;font-family:var(--mono);font-size:12px}
  .sync-note{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin-top:10px;justify-content:center}
  .sync-dot{width:7px;height:7px;border-radius:99px;background:var(--ink-3)}
  .sync-dot.on{background:var(--good)} .sync-dot.err{background:var(--bad)}
  .pack-item{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:10px;padding:7px 10px;font-size:12.5px;margin-top:6px}
  .pack-item b{font-weight:700} .pack-item .s{color:var(--ink-3);font-size:11px}
  .pack-item button{margin-left:auto;border:0;background:none;color:var(--bad);font-size:12px;font-weight:700;padding:2px 4px}
  /* ── 左側教材選單 ─────────────────────────── */
  .drawer{position:fixed;top:0;bottom:0;left:0;z-index:50;width:min(86vw,300px);background:var(--surface);
    border-right:1px solid var(--line);box-shadow:var(--shadow-lift);transform:translateX(-105%);
    transition:transform .26s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
  .drawer.open{transform:none}
  .dscrim{position:fixed;inset:0;z-index:45;background:rgba(10,20,17,.45);display:none}
  .dscrim.show{display:block}
  .drawer-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .drawer-head b{font-family:var(--disp);font-weight:800;font-size:16px}
  .drawer-head .icon-btn{margin-left:auto}
  .drawer-body{flex:1;overflow-y:auto;padding:6px 10px calc(24px + env(safe-area-inset-bottom,0px))}
  .dg-head{display:flex;align-items:center;gap:7px;width:100%;border:0;background:none;padding:12px 4px 8px;font-size:14px;color:var(--ink);text-align:left}
  .dg-head b{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dg-head .chev{display:inline-block;width:12px;color:var(--ink-3);font-size:17px;transition:transform .2s}
  .dg-head .chev.open{transform:rotate(90deg)}
  .dg-n{font-size:10.5px;color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums}
  .dg-list{display:flex;flex-direction:column;gap:3px;padding:0 0 6px 14px}
  .dunit{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:3px 8px;width:100%;border:1px solid transparent;
    background:none;border-radius:11px;padding:8px 9px;text-align:left;color:var(--ink)}
  .dunit:hover{background:var(--surface-2)}
  .dunit.cur{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  .du-l{font-family:var(--disp);font-weight:800;font-size:11.5px;color:var(--ink-2);white-space:nowrap}
  .du-t{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .du-p{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .du-bar{grid-column:1/-1;display:block;height:3px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .du-bar i{display:block;height:100%;background:var(--accent)}
  .du-new{display:inline-block;font-size:9.5px;font-weight:800;color:#fff;background:var(--rec);border-radius:6px;padding:1px 5px;margin-left:5px;vertical-align:1px}
  .dg-queue{font-size:11px;color:var(--ink-3);padding:4px 9px 6px}
  @media (min-width:1240px){
    .drawer{transform:none;box-shadow:none;z-index:30}
    #menuBtn,#drawerX{display:none}
    .dscrim{display:none!important}
  }

  /* ── 目前單元列 ───────────────────────────── */
  .ubar{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line-2);background:var(--surface);
    border-radius:14px;padding:9px 12px;text-align:left;color:var(--ink);box-shadow:var(--shadow)}
  .ubar-ic{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);display:grid;place-items:center;font-size:15px;flex:none}
  .ubar-t{flex:1;min-width:0;display:flex;flex-direction:column}
  .ubar-t b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ubar-t span{font-size:11px;color:var(--ink-2)}
  .ubar-go{font-size:12px;font-weight:700;color:var(--accent-deep);flex:none}
  :root[data-theme="dark"] .ubar-go,:root:not([data-theme="light"]) .ubar-go{color:var(--accent)}

  /* ── 影片＋同步逐字稿 ─────────────────────── */
  .ytsticky{position:sticky;top:-14px;z-index:6;background:var(--bg);margin-top:-14px;padding:14px 0 8px}
  .ytwrap #ytp{position:absolute;inset:0;width:100%;height:100%;border:0}
  .src-box a{display:block;color:var(--accent-deep);font-size:12px;font-weight:700;margin-top:5px;word-break:break-all;text-decoration:none}
  :root[data-theme="dark"] .src-box a,:root:not([data-theme="light"]) .src-box a{color:var(--accent)}
  .tx-tools{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .tx-tools .spd{margin-left:0}
  .sbtn.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  .txbox{display:flex;flex-direction:column;gap:4px}
  .tx-line{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border-radius:12px;border:1px solid transparent;transition:background .2s,border-color .2s}
  .tx-line.cur{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
  .tx-t{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:4px 7px;font-family:var(--mono);
    font-size:11px;color:var(--ink-2);margin-top:1px;white-space:nowrap}
  .tx-line.cur .tx-t{background:var(--accent);color:var(--on-accent);border-color:transparent}
  .tx-body{flex:1;min-width:0}
  .tx-en{font-family:var(--en);font-size:15px;line-height:1.55;cursor:pointer}
  .tx-en b{color:var(--accent-deep);font-weight:800}
  :root[data-theme="dark"] .tx-en b,:root:not([data-theme="light"]) .tx-en b{color:var(--accent)}
  .tx-zh{font-size:13px;color:var(--ink-2);margin-top:3px;line-height:1.55}
  .txbox.nozh .tx-zh{display:none}
  .txbox.hideen .tx-line:not(.show) .tx-en{filter:blur(5px);opacity:.6}
  .sbar.mini{margin-top:6px;gap:6px}
  .sbar.mini .sbtn{padding:5px 9px;font-size:11.5px}

  .linkbtn{border:0;background:none;color:var(--accent-deep);font-size:12.5px;font-weight:700;padding:4px 0}
  :root[data-theme="dark"] .linkbtn,:root:not([data-theme="light"]) .linkbtn{color:var(--accent)}
  .diagbox{display:none}
  .diagbox.show{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding:11px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface-2)}
  .diaglist{max-height:220px;overflow-y:auto;font-size:12.5px;line-height:1.9}
  .dq{display:inline-block;min-width:44px;text-align:center;font-size:10.5px;font-weight:800;border-radius:6px;padding:0 5px;margin-right:4px;background:var(--line);color:var(--ink-2)}
  .dq-高品質,.dq-增強版,.dq-Natural{background:var(--good-bg);color:var(--good)}

  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(12px);
    z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;
    box-shadow:var(--shadow-lift);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:88vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .fade{animation:fade .25s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  ::-webkit-scrollbar{width:0;height:0}
</style>
</head>
<body>
<div id="app">
  <header><div class="head-in">
    <button class="icon-btn" id="menuBtn" aria-label="教材選單">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="brand"><div class="brand-mark">字</div><b id="hTitle">多益字彙旅程</b></div>
    <button class="icon-btn" id="gearBtn" aria-label="設定">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L14.5 2h-4l-.4 2.6a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L6 11a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6a7 7 0 0 0 .1-1z"/></svg>
    </button>
  </div></header>
  <main id="main"></main>
  <nav><div class="nav-inner" id="nav">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>首頁</button>
    <button data-tab="vocab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18"/></svg>單字</button>
    <button data-tab="listen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>聽力</button>
    <button data-tab="read"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H3z"/><path d="M21 5h-7a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h7z"/></svg>閱讀</button>
    <button data-tab="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l2.5 2.5L16 8"/><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/></svg>測驗</button>
    <button data-tab="checkin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></svg>打卡</button>
  </div></nav>
</div>

<!-- 左側教材選單：手機滑出、寬螢幕常駐 -->
<div class="dscrim" id="dscrim"></div>
<aside class="drawer" id="drawer" aria-label="教材選單">
  <div class="drawer-head"><b>教材</b><span class="tiny muted">點標題可展開／收合</span>
    <button class="icon-btn" id="drawerX" aria-label="關閉選單">✕</button></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-label="設定">
    <div class="sheet-head" id="sheetHead"><div class="grab"></div>
      <div class="row"><b style="flex:1;font-size:17px">設定</b><button class="sheet-done" id="sheetDone">完成</button></div></div>
    <div class="set-row"><div class="lab"><b>朗讀語速</b><span>所有跟讀／範讀共用</span></div>
      <div class="spd" id="rateSeg" style="margin-left:0"></div></div>
    <div class="set-row"><div class="lab"><b>朗讀口音</b><span>自然語音的單字與例句都有美／英／澳三種；「三種連播」會同一句各念一次</span></div>
      <div id="accSetting"></div></div>
    <div class="set-row"><div class="lab"><b>發音嗓音</b><span>⭐ 為較自然的語音</span></div>
      <div class="row" style="gap:6px"><select class="native" id="voiceSel"></select>
        <button class="btn ghost sm" id="voiceTry">試聽</button></div>
      <div class="tiny muted" id="voiceHint" style="flex-basis:100%;line-height:1.6"></div>
      <div style="flex-basis:100%"><button class="linkbtn" id="voiceDiagBtn">看不到下載的聲音？點這裡檢查 ›</button>
        <div class="diagbox" id="voiceDiag"></div></div></div>
    <div class="set-row"><div class="lab"><b>外觀主題</b><span>跟隨系統或手動切換</span></div>
      <div class="spd" id="themeSeg" style="margin-left:0">
        <button data-th="auto">自動</button><button data-th="light">亮</button><button data-th="dark">暗</button></div></div>
    <div class="set-row"><div class="lab"><b>跨裝置同步</b><span>填入同步網址與金鑰後，手機與電腦進度互通</span>
      <input class="native" id="syncUrl" placeholder="https://xxx.workers.dev" autocomplete="off" spellcheck="false">
      <input class="native" id="syncKey" placeholder="同步金鑰（兩台裝置要填一樣）" autocomplete="off" spellcheck="false"></div>
      <button class="btn ghost sm" id="syncSave">儲存並同步</button></div>
    <div class="set-row"><div class="lab"><b>教材包</b><span>有版權的教材不進 GitHub，從雲端硬碟匯入到這台裝置（可同時選 .json 和音檔）</span>
      <div id="packList" style="margin-top:8px"></div></div>
      <button class="btn ghost sm" id="packBtn">匯入教材包</button></div>
    <div class="set-row"><div class="lab"><b>備份／還原進度</b><span>匯出成檔案，換裝置時匯入</span></div>
      <div class="row" style="gap:7px"><button class="btn ghost sm" id="expBtn">匯出</button>
      <button class="btn ghost sm" id="impBtn">匯入</button></div></div>
    <div class="set-row"><div class="lab"><b>重設本單元進度</b><span>只清除目前單元</span></div>
      <button class="btn ghost sm" id="resetBtn">重設</button></div>
    <div class="sync-note"><span class="sync-dot" id="syncDot"></span><span id="syncText">進度儲存在此裝置</span></div>
  </div>
</div>
<input type="file" id="impFile" accept="application/json,.json" hidden>
<input type="file" id="packFile" accept=".json,audio/*,video/mp4,.mp4,.m4a,.mp3" multiple hidden>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<!-- 內建課程：加新的就在這裡多一行 -->
<script src="courses/daily-video.js"></script>
<script src="courses/bbc-6min.js"></script>
<script src="app.js"></script>
</body>
</html>
